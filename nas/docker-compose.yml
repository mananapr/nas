version: "3.9"

services:
  postgres:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.7
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_MAIN_DB}
      - POSTGRES_INITDB_ARGS='--data-checksums'
      - DB_STORAGE_TYPE=HDD
    ports:
      - "5432:5432"
    volumes:
      - /mnt/home/docker/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped

  microbin:
    image: danielszabo99/microbin:2.1.4
    container_name: microbin
    environment:
      - MICROBIN_PORT=8080
      - MICROBIN_PRIVATE=true
      - MICROBIN_READONLY=true
      - MICROBIN_UPLOADER_PASSWORD=${MICROBIN_UPLOADER_PASSWORD}
      - MICROBIN_EDITABLE=false
      - MICROBIN_TITLE=Microbin
    ports:
      - "8080:8080"
    volumes:
      - /mnt/home/docker/microbin:/app/microbin_data
    restart: unless-stopped

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
    container_name: paperless
    depends_on:
      - postgres
      - redis
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBHOST=postgres
      - PAPERLESS_DBNAME=${PAPERLESS_DB}
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USER}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASS}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_TIME_ZONE=${TZ}
      - PAPERLESS_URL=https://docs.gl1tch.art
    ports:
      - "8000:8000"
    volumes:
      - /mnt/home/docker/paperless/data:/usr/src/paperless/data
      - /mnt/home/docker/paperless/media:/usr/src/paperless/media
      - /mnt/home/docker/paperless/export:/usr/src/paperless/export
      - /mnt/home/docker/paperless/consume:/usr/src/paperless/consume
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ}
      - WEBUI_PORT=8081
    volumes:
      - /mnt/home/docker/qbittorrent/config:/config
      - /mnt/home/video:/downloads
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    environment:
      - TZ=${TZ}
    group_add:
      - '107'
    volumes:
      - /mnt/home/docker/jellyfin/config:/config
      - /mnt/home/docker/jellyfin/cache:/cache
      - /mnt/home/video:/media/video
      - /mnt/home/music:/media/music
      - /mnt/home/photo:/media/photo
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2
    container_name: immich_server
    depends_on:
      - postgres
      - redis
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=${IMMICH_DB_USER}
      - DB_PASSWORD=${IMMICH_DB_PASS}
      - DB_DATABASE_NAME=${IMMICH_DB}
      - REDIS_HOSTNAME=redis
    volumes:
      - /mnt/home/docker/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
    container_name: immich_machine_learning
    restart: unless-stopped
    depends_on:
      - immich-server
    volumes:
      - /mnt/home/docker/immich/ml-cache:/cache

  miniflux:
    image: miniflux/miniflux:2.3.5
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgres://${MINIFLUX_DB_USER}:${MINIFLUX_DB_PASS}@postgres/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_ADMIN_USER}
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASS}

  trilium:
    image: triliumnext/trilium:v0.107.0
    container_name: trilium
    restart: unless-stopped
    volumes:
      - /mnt/home/docker/memos:/home/node/trilium-data
    ports:
      - 5230:8080

  immich-public-proxy:
    image: alangrainger/immich-public-proxy:4.2.0
    container_name: immich-public-proxy
    restart: always
    ports:
      - "3000:3000"
    environment:
      PUBLIC_BASE_URL: https://img.gl1tch.art
      IMMICH_URL: http://immich-server:2283
    depends_on:
      - immich-server
    healthcheck:
      test: curl -s http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s

  copyparty:
    image: copyparty/ac:1.20.26
    container_name: copyparty
    environment:
      - TZ=${TZ}
    ports:
      - "3923:3923"
    volumes:
      - /mnt/home/docker/copyparty:/cfg
      - /mnt/home/video:/files/video
      - /mnt/home/music:/files/music
      - /mnt/home/photo:/files/photo
    command:
      - "-a"
      - "${COPYPARTY_USER}:${COPYPARTY_PASSWORD}"
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: https://beszel.gl1tch.art
      DISABLE_SSH: "true"
      SMART_INTERVAL: 1h
      ZFS_INTERVAL: 1h
      SMART_DEVICES: /dev/sda,/dev/sdb,/dev/sdc,/dev/sdd
    volumes:
      - /mnt/home/docker/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    devices:
      - /dev/zfs:/dev/zfs
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN

version: '3'

services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    container_name: vaultwarden
    restart: always
    ports:
      - 9090:80
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
    volumes:
      - vw-data:/data
    labels:
      - docker-volume-backup.stop-during-backup=true

  baikal:
    image: ghcr.io/aalmenar/baikal:0.12.1-nginx
    restart: always
    ports:
      - "8006:80"
    volumes:
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific
    labels:
      - docker-volume-backup.stop-during-backup=true

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8
    container_name: homepage
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./homepage:/app/config
    environment:
        HOMEPAGE_ALLOWED_HOSTS: gl1tch.art

  headscale:
    image: docker.io/headscale/headscale:v0.29.2
    command: serve
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./headscale:/etc/headscale
      - headscale-data:/var/lib/headscale
    labels:
      - docker-volume-backup.stop-during-backup=true

  soju:
    build:
      context: ./soju
    container_name: soju
    restart: unless-stopped
    ports:
      - "127.0.0.1:6667:6667"
    volumes:
      - ./soju:/etc/soju:ro
      - soju-data:/var/lib/soju
    command: ["-config", "/etc/soju/soju.conf"]
    labels:
      - docker-volume-backup.stop-during-backup=true

  caddy:
    build:
      context: ./caddy
    container_name: caddy
    network_mode: "host"
    restart: unless-stopped
    environment:
      NAS_TAILNET_IP: ${NAS_TAILNET_IP}
      NUC_TAILNET_IP: ${NUC_TAILNET_IP}
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER}
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY}
      NAMECHEAP_CLIENT_IP: ${NAMECHEAP_CLIENT_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    labels:
      - docker-volume-backup.stop-during-backup=true

  beszel:
    image: henrygd/beszel:0.21.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      APP_URL: https://beszel.gl1tch.art
      DISABLE_SSH: "true"
    volumes:
      - beszel-data:/beszel_data
    labels:
      - docker-volume-backup.stop-during-backup=true

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2
    restart: unless-stopped
    network_mode: host
    environment:
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: https://beszel.gl1tch.art
      DISABLE_SSH: "true"
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backup:
    image: offen/docker-volume-backup:v2.50.1
    restart: unless-stopped
    environment:
      BACKUP_FILENAME: "daily-backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "daily-backup-"
      BACKUP_CRON_EXPRESSION: "00 21 * * *"
      BACKUP_RETENTION_DAYS: 7
      AWS_ACCESS_KEY_ID: ${B2_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_KEY}
      AWS_ENDPOINT: ${B2_ENDPOINT}
      AWS_S3_BUCKET_NAME: ${B2_BUCKET}
      AWS_S3_PATH: "vps-docker"
    volumes:
      - vw-data:/backup/vw-data
      - baikal-config:/backup/baikal-config
      - baikal-data:/backup/baikal-data
      - headscale-data:/backup/headscale-data
      - soju-data:/backup/soju-data
      - caddy-data:/backup/caddy-data
      - caddy-config:/backup/caddy-config
      - beszel-data:/backup/beszel-data
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  vw-data:
  baikal-config:
  baikal-data:
  headscale-data:
  soju-data:
  caddy-data:
  caddy-config:
  beszel-data:
  beszel-agent-data:

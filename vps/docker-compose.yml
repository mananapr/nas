version: '3'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    ports:
      - 9090:80
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
    volumes:
      - vw-data:/data
    labels:
      - docker-volume-backup.stop-during-backup=true

  baikal:
    image: ckulka/baikal:nginx
    restart: always
    ports:
      - "8006:80"
    volumes:
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific
    labels:
      - docker-volume-backup.stop-during-backup=true

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    network_mode: "host"
    volumes:
      - ./homepage:/app/config
    environment:
        HOMEPAGE_ALLOWED_HOSTS: gl1tch.art

  headscale:
    image: docker.io/headscale/headscale:v0.26.1
    command: serve
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./headscale:/etc/headscale
      - headscale-data:/var/lib/headscale
    labels:
      - docker-volume-backup.stop-during-backup=true

  backup:
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    environment:
      BACKUP_FILENAME: "daily-backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "daily-backup-"
      BACKUP_CRON_EXPRESSION: "00 21 * * *"
      BACKUP_RETENTION_DAYS: 7
      AWS_ACCESS_KEY_ID: ${B2_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_KEY}
      AWS_ENDPOINT: ${B2_ENDPOINT}
      AWS_S3_BUCKET_NAME: ${B2_BUCKET}
      AWS_S3_PATH: "docker"
    volumes:
      - vw-data:/backup/vw-data
      - baikal-config:/backup/baikal-config
      - baikal-data:/backup/baikal-data
      - headscale-data:/backup/headscale-data
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  vw-data:
  baikal-config:
  baikal-data:
  headscale-data:
